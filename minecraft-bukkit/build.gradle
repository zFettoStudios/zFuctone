dependencies {
    implementation project(":api")
    implementation project(":common")
    implementation project(":minecraft-paper")

    implementation libraries.cloud.bukkit

    compileOnly libraries.platform.spigot

    compileOnly libraries.integration.placeholderapi
}

processResources {
    def props = [
            "name": "$project_name",
            "description": "$project_description",
            "prefix": "$project_name",
            "version": "$project_version",
            "main": "${project_group}.BukkitLoader",
            "api_version": "1.8",
            "load": "POSTWORLD",
            "folia_supported": true,
            "author": "$project_authors",
            "website": "$project_website"
    ]

    inputs.properties props
    filteringCharset = "UTF-8"

    filesMatching("plugin.yml") {
        expand props
    }
}