plugins {
    id "io.papermc.paperweight.userdev" version "$paperweight_userdev_version"
}

dependencies {
    implementation project(":api")
    implementation project(":common")

    implementation libraries.cloud.paper

    compileOnly libraries.integration.placeholderapi
    compileOnly libraries.integration.miniplaceholders

    paperweightDevelopmentBundle libraries.platform.paper
}

processResources {
    def props = [
            "name": "$project_name",
            "description": "$project_description",
            "prefix": "$project_name",
            "version": "$project_version",
            "main": "${project_group}.BukkitBootstrap",
            "api_version": "1.8",
            "load": "POSTWORLD",
            "folia_supported": true,
            "author": "$project_authors",
            "website": "$project_website"
    ]

    inputs.properties props
    filteringCharset = "UTF-8"

    filesMatching("plugin.yml") {
        expand props
    }
}