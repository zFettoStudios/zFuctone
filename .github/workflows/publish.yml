name: Publish to Github and Maven central

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JDK 26
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build minecraft-bukkit
        run: ./gradlew :minecraft-bukkit:build

      - name: Build minecraft-velocity
        run: ./gradlew :minecraft-velocity:build

      - name: Build minecraft-core
        run: ./gradlew :minecraft-core:build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zFuctone All
          path: build/compiled
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Bukkit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zFuctone Bukkit
          path: build/compiled/zFuctone-Bukkit-*.jar
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Velocity artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zFuctone Velocity
          path: build/compiled/zFuctone-Velocity-*.jar
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Core artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zFuctone Core
          path: build/compiled/zFuctone-Core-*.jar
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/compiled

      - name: Check version in gradle.properties
        id: check_version
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -n "$VERSION" && "$VERSION" != *"-SNAPSHOT"* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload files
        if: steps.check_version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: Release ${{ steps.check_version.outputs.version }}
          files: |
            build/compiled/**/*
          draft: false
          prerelease: false