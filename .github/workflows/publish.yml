name: Publish to Github and Maven central

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JDK 26
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build minecraft-bukkit
        run: ./gradlew :minecraft-bukkit:build

      - name: Build minecraft-velocity
        run: ./gradlew :minecraft-velocity:build

      - name: Build minecraft-core
        run: ./gradlew :minecraft-core:build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zFuctone
          path: build/compiled
          if-no-files-found: warn
          retention-days: 14

      - name: Upload each file as separate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          shopt -s nullglob
          for file in build/compiled/*; do
            [ -f "$file" ] || continue
            base_name=$(basename "$file")
            artifact_name="${base_name%.*}"
            gh run upload "$RUN_ID" "$file" --name "$artifact_name"
          done